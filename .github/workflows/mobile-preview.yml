name: Build mobile previews
on:
  push:
    branches: [mobile-beta]
  workflow_dispatch:
    inputs:
      api_origin:
        description: HTTPS origin of the agency staging server
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: android
          - os: macos-26
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      VITE_TRAVEL_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - if: env.VITE_TRAVEL_ORIGIN != ''
        run: node scripts/check-beta-backend.mjs
      - if: env.VITE_TRAVEL_ORIGIN != ''
        run: node scripts/check-beta-backend.mjs
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm build
      - run: pnpm exec cap sync ${{ matrix.platform }}
      - if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.platform == 'android'
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - if: matrix.platform == 'android' && env.VITE_TRAVEL_ORIGIN != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-world-android-preview
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 5
      - if: matrix.platform == 'ios'
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/TravelBuild" CODE_SIGNING_ALLOWED=NO build
