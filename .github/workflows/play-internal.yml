name: Build Google Play internal bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: New integer version code for Google Play
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: mobile-beta
    env:
      VITE_TRAVEL_ORIGIN: ${{ vars.VITE_TRAVEL_ORIGIN }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Check the version code
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo "Enter a Google Play version code between 1 and 2100000000." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-beta-backend.mjs
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm mobile:sync android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the release bundle
        working-directory: android
        run: bash gradlew :app:bundleRelease "-PtravelVersionCode=$VERSION_CODE" --no-daemon
      - name: Sign and verify with the agency upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing Android upload keystore}" "${STORE_PASSWORD:?Missing store password}"
          : "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}"
          umask 077
          keyfile=$(mktemp "$RUNNER_TEMP/upload-key.XXXXXX")
          trap 'rm -f -- "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$keyfile" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD "$bundle" "$KEY_ALIAS"
          jarsigner -verify -strict -keystore "$keyfile" -storepass:env STORE_PASSWORD "$bundle" "$KEY_ALIAS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-world-play-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
